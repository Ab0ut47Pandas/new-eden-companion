name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  windows-updater-startup:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Exercise detached updater handshake
        run: node scripts/test-update-startup.mjs

  sde-current-smoke:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/sde-static-db-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Download and import current CCP JSONL SDE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nec-sde/download" "$RUNNER_TEMP/nec-sde/extract"
          ZIP="$RUNNER_TEMP/nec-sde/download/eve-sde.zip"
          EFFECTIVE_URL="$(curl --fail --location --retry 3 \
            --silent --show-error \
            --write-out '%{url_effective}' \
            --output "$ZIP" \
            'https://developers.eveonline.com/static-data/eve-online-static-data-latest-jsonl.zip')"
          BUILD="$(basename "$EFFECTIVE_URL" | sed -E 's/^eve-online-static-data-([0-9]+)-jsonl\.zip$/\1/')"
          if ! [[ "$BUILD" =~ ^[0-9]+$ ]]; then
            echo "Could not derive SDE build from redirected URL: $EFFECTIVE_URL" >&2
            exit 1
          fi
          echo "Current CCP SDE build: $BUILD"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/nec-sde/extract"
          TYPES="$(find "$RUNNER_TEMP/nec-sde/extract" -type f -name types.jsonl -print -quit)"
          test -n "$TYPES"
          SOURCE="$(dirname "$TYPES")"
          node scripts/sde/build-static-db.mjs \
            --source "$SOURCE" \
            --build "$BUILD" \
            --output "$RUNNER_TEMP/nec-sde/eve-static.db"
          node - "$RUNNER_TEMP/nec-sde/eve-static.db" <<'NODE'
          const { DatabaseSync } = require('node:sqlite');
          const db = new DatabaseSync(process.argv[2]);
          const checks = {
            types: db.prepare('SELECT COUNT(*) AS count FROM types').get().count,
            blueprints: db.prepare('SELECT COUNT(*) AS count FROM blueprints').get().count,
            products: db.prepare('SELECT COUNT(*) AS count FROM blueprint_products').get().count,
            requirements: db.prepare('SELECT COUNT(*) AS count FROM type_skill_requirements').get().count,
          };
          console.log(checks);
          for (const [name, count] of Object.entries(checks)) {
            if (!(Number(count) > 0)) throw new Error(`${name} imported zero rows`);
          }
          db.close();
          NODE
