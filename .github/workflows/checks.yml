name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  windows-updater-startup:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Exercise detached updater handshake
        run: node scripts/test-update-startup.mjs

  sde-current-smoke:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/sde-static-db-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Download and import current CCP JSONL SDE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nec-sde/download" "$RUNNER_TEMP/nec-sde/extract"
          ZIP="$RUNNER_TEMP/nec-sde/download/eve-sde.zip"
          EFFECTIVE_URL="$(curl --fail --location --retry 3 \
            --silent --show-error \
            --write-out '%{url_effective}' \
            --output "$ZIP" \
            'https://developers.eveonline.com/static-data/eve-online-static-data-latest-jsonl.zip')"
          BUILD="$(basename "$EFFECTIVE_URL" | sed -E 's/^eve-online-static-data-([0-9]+)-jsonl\.zip$/\1/')"
          if ! [[ "$BUILD" =~ ^[0-9]+$ ]]; then
            echo "Could not derive SDE build from redirected URL: $EFFECTIVE_URL" >&2
            exit 1
          fi
          echo "Current CCP SDE build: $BUILD"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/nec-sde/extract"
          TYPES="$(find "$RUNNER_TEMP/nec-sde/extract" -type f -name types.jsonl -print -quit)"
          test -n "$TYPES"
          SOURCE="$(dirname "$TYPES")"

          python - "$SOURCE" <<'PY'
          import collections, json, pathlib, sys
          source = pathlib.Path(sys.argv[1])
          with (source / 'blueprints.jsonl').open(encoding='utf-8') as handle:
              for index, line in enumerate(handle, 1):
                  if index != 1283:
                      continue
                  record = json.loads(line)
                  value = record.get('_value') if isinstance(record.get('_value'), dict) else record
                  print('Blueprint line 1283:', json.dumps(record, sort_keys=True))
                  for activity_name, activity in (value.get('activities') or {}).items():
                      skills = activity.get('skills') or []
                      if not skills:
                          continue
                      grouped = collections.defaultdict(list)
                      for skill in skills:
                          grouped[skill.get('typeID')].append(skill.get('level'))
                      print('activity:', activity_name, 'skills:', skills)
                      print('duplicates:', {k: v for k, v in grouped.items() if len(v) > 1})
                  break
          PY

          node scripts/sde/build-static-db.mjs \
            --source "$SOURCE" \
            --build "$BUILD" \
            --output "$RUNNER_TEMP/nec-sde/eve-static.db"
