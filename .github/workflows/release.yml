name: release

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Resolve version and release state
        id: release
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "package.json must use a stable x.y.z version." }
          $expectedTag = "v$version"
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { $expectedTag }
          if ($tag -ne $expectedTag) { throw "Release tag $tag does not match package.json version $expectedTag." }

          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "User-Agent" = "New-Eden-Companion-Release"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $exists = $false
          try {
            Invoke-WebRequest -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" -Headers $headers -Method Get | Out-Null
            $exists = $true
          } catch {
            $statusCode = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 0 }
            if ($statusCode -ne 404) { throw }
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($exists) { Write-Host "Release $tag already exists; packaging is not needed." }
      - if: steps.release.outputs.exists != 'true'
        run: npm ci
      - if: steps.release.outputs.exists != 'true'
        run: npm test
      - if: steps.release.outputs.exists != 'true'
        run: npm run typecheck
      - if: steps.release.outputs.exists != 'true'
        run: npm run lint
      - name: Build and validate current CCP static database
        if: steps.release.outputs.exists != 'true'
        run: npm run sde:current
      - name: Verify static database checksum
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          $checksumLine = (Get-Content -LiteralPath static/eve-static.db.sha256 -Raw).Trim()
          $expected = ($checksumLine -split '\s+')[0].ToLowerInvariant()
          if ($expected -notmatch '^[0-9a-f]{64}$') { throw "Static DB checksum file is invalid." }
          $actual = (Get-FileHash -LiteralPath static/eve-static.db -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Static DB checksum mismatch: expected $expected, got $actual." }
          $metadata = Get-Content -Raw -LiteralPath static/eve-static.metadata.json | ConvertFrom-Json
          if (-not $metadata.sdeBuild) { throw "Static DB metadata is missing the CCP SDE build." }
          Write-Host "Validated CCP SDE build $($metadata.sdeBuild), SHA-256 $actual"
      - if: steps.release.outputs.exists != 'true'
        run: npm run package:windows
      - if: steps.release.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: new-eden-companion-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Publish stable GitHub release
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $assets = Get-ChildItem -Path dist -File | Where-Object { $_.Extension -in @(".zip", ".sha256") }
          if (-not $assets) { throw "The Windows packaging step produced no release assets." }
          gh release create $tag @($assets.FullName) --target "${{ github.sha }}" --generate-notes --title "New Eden Companion $tag"
