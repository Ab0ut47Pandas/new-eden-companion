name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: new-eden-companion-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem -Path dist -File | Where-Object { $_.Extension -in @(".zip", ".sha256") }
          gh release create "${{ github.ref_name }}" @($assets.FullName) --generate-notes --title "New Eden Companion ${{ github.ref_name }}"
