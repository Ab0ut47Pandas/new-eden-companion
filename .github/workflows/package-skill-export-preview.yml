name: package-skill-export-preview

on:
  push:
    branches: ["agent/copy-trained-skills"]

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run package:windows
      - name: Publish preview download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem -Path dist -File | Where-Object { $_.Extension -in @(".zip", ".sha256") }
          gh release create "v0.1.3-skill-export-preview" @($assets.FullName) --target "${{ github.sha }}" --prerelease --title "New Eden Companion - Skill Export Preview" --notes "Preview build adding Copy all trained skills to the Skills screen."
