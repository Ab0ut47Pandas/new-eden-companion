name: windows-release-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-release-smoke.yml"
      - ".github/workflows/release.yml"
      - "scripts/sde/**"
      - "scripts/package-windows.ps1"
      - "scripts/package-database-policy.ps1"
      - "scripts/start-portable.ps1"
      - "scripts/update-portable.ps1"
      - "scripts/test-portable-launcher-stale-instance.mjs"
      - "package.json"
      - "package-lock.json"
      - "src/app/activities/**"
      - "src/app/api/hauling/**"
      - "src/lib/activity/**"
      - "src/lib/economy/trade-run-degraded*"
      - "src/components/activity-*.tsx"
      - "src/components/activity-*.module.css"
      - "src/components/abyssal-*.tsx"
      - "src/components/abyssal-*.module.css"
      - "src/components/live-data-unavailable.tsx"

permissions:
  contents: read

jobs:
  package-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and validate current CCP static database
        run: npm run sde:current
      - name: Verify static database checksum and metadata
        shell: pwsh
        run: |
          $checksumLine = (Get-Content -LiteralPath static/eve-static.db.sha256 -Raw).Trim()
          $expected = ($checksumLine -split '\s+')[0].ToLowerInvariant()
          if ($expected -notmatch '^[0-9a-f]{64}$') { throw "Static DB checksum file is invalid." }
          $actual = (Get-FileHash -LiteralPath static/eve-static.db -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Static DB checksum mismatch: expected $expected, got $actual." }
          $metadata = Get-Content -Raw -LiteralPath static/eve-static.metadata.json | ConvertFrom-Json
          if (-not $metadata.sdeBuild) { throw "Static DB metadata is missing the CCP SDE build." }
          Write-Host "Validated CCP SDE build $($metadata.sdeBuild), SHA-256 $actual"
      - name: Build portable Windows package
        run: npm run package:windows
      - name: Inspect package output
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path dist -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw "Packaging produced no ZIP." }
          $extract = Join-Path $env:RUNNER_TEMP 'nec-package-smoke'
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extract -Force
          $staticDb = Get-ChildItem -Path $extract -Recurse -File -Filter 'eve-static.db'
          if ($staticDb.Count -ne 1) { throw "Expected exactly one bundled eve-static.db; found $($staticDb.Count)." }
          $privateDb = Get-ChildItem -Path $extract -Recurse -File | Where-Object { $_.FullName -match '[\\/]data[\\/].*\.(db|sqlite|sqlite3)$' }
          if ($privateDb) { throw "Portable ZIP contains a private data database." }
          Write-Host "Package contains static DB: $($staticDb[0].FullName)"
      - name: Exercise portable hauling, industry, and degraded states
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem -Path dist -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw "Packaging produced no ZIP." }
          $extract = Join-Path $env:RUNNER_TEMP 'nec-beta15-portable'
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extract -Force

          $serverFile = Get-ChildItem -Path $extract -Recurse -File -Filter 'server.js' | Where-Object { Test-Path (Join-Path $_.Directory.FullName 'runtime\node.exe') } | Select-Object -First 1
          if (-not $serverFile) { throw "Portable package root with server.js and runtime/node.exe is missing." }
          $packageRoot = $serverFile.Directory.FullName
          $server = $serverFile.FullName
          $node = Join-Path $packageRoot 'runtime\node.exe'
          $envFile = Join-Path $packageRoot '.env.local'
          @(
            'AUTH_SECRET=beta15-portable-validation-secret-1234567890',
            'EVE_CLIENT_ID=beta15-portable-client-id',
            'EVE_REDIRECT_URI=http://localhost:3000/api/auth/callback'
          ) | Set-Content -LiteralPath $envFile -Encoding utf8

          function Start-Nec([int]$Port, [string]$StaticDatabasePath = '') {
            $env:HOSTNAME = 'localhost'
            $env:PORT = [string]$Port
            $env:NODE_ENV = 'production'
            if ($StaticDatabasePath) { $env:STATIC_DATABASE_PATH = $StaticDatabasePath } else { Remove-Item Env:STATIC_DATABASE_PATH -ErrorAction SilentlyContinue }
            $stdout = Join-Path $env:RUNNER_TEMP "nec-beta15-$Port.out.log"
            $stderr = Join-Path $env:RUNNER_TEMP "nec-beta15-$Port.err.log"
            $process = Start-Process -FilePath $node -ArgumentList "--env-file-if-exists=$envFile", $server -WorkingDirectory $packageRoot -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $base = "http://localhost:$Port"
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if ($process.HasExited) {
                Get-Content $stdout -ErrorAction SilentlyContinue | Write-Host
                Get-Content $stderr -ErrorAction SilentlyContinue | Write-Host
                throw "Portable NEC exited before becoming ready (code $($process.ExitCode))."
              }
              try {
                $response = Invoke-WebRequest -Uri "$base/api/static-data/health" -UseBasicParsing -TimeoutSec 2 -SkipHttpErrorCheck
                if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 500) { return @{ Process = $process; Base = $base } }
              } catch {}
              Start-Sleep -Seconds 1
            }
            Get-Content $stdout -ErrorAction SilentlyContinue | Write-Host
            Get-Content $stderr -ErrorAction SilentlyContinue | Write-Host
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Portable NEC did not become ready on port $Port."
          }

          function Assert-Page([string]$Uri, [string]$Needle, [hashtable]$Headers = @{}) {
            $response = Invoke-WebRequest -Uri $Uri -UseBasicParsing -TimeoutSec 15 -Headers $Headers
            if ($response.StatusCode -ne 200) { throw "Expected HTTP 200 from $Uri; got $($response.StatusCode)." }
            if ($response.Content -notmatch [regex]::Escape($Needle)) { throw "Expected '$Needle' in $Uri." }
            return $response.Content
          }

          $healthy = Start-Nec 3000
          try {
            Assert-Page "$($healthy.Base)/activities/hauling" 'Hauling readiness' | Out-Null
            Assert-Page "$($healthy.Base)/activities/hauling/trade-run" 'Find me the best run' | Out-Null
            Assert-Page "$($healthy.Base)/activities/industry/manufacturing" 'Manufacturing planner' | Out-Null

            $staleHeaders = @{ Cookie = 'eve_session=missing-beta15-session' }
            $haulingUnavailable = Assert-Page "$($healthy.Base)/activities/hauling" 'Live information unavailable' $staleHeaders
            if ($haulingUnavailable -match 'Demo data is active') { throw 'Hauling substituted demo data for an unavailable connected session.' }
            $tradeUnavailable = Assert-Page "$($healthy.Base)/activities/hauling/trade-run" 'Live information unavailable' $staleHeaders
            if ($tradeUnavailable -match 'Demo wallet shown') { throw 'Trade-run planner substituted demo wallet data for an unavailable connected session.' }
          } finally {
            Stop-Process -Id $healthy.Process.Id -Force -ErrorAction SilentlyContinue
            $healthy.Process.WaitForExit(10000) | Out-Null
          }

          $missingDb = Join-Path $env:RUNNER_TEMP 'nec-beta15-missing-static.db'
          if (Test-Path $missingDb) { Remove-Item -Force $missingDb }
          $degraded = Start-Nec 3001 $missingDb
          try {
            Assert-Page "$($degraded.Base)/activities/industry/manufacturing" 'local static EVE database is not installed' | Out-Null
            $body = @{
              originSystemId = 30002187
              destinationSystemId = 30000142
              cargoCapacityM3 = 1000
              capitalIsk = 100000000
              salesTaxPercent = 7.5
              goal = 'profit'
            } | ConvertTo-Json
            $response = Invoke-WebRequest -Uri "$($degraded.Base)/api/hauling/trade-run/discover" -Method Post -ContentType 'application/json' -Body $body -UseBasicParsing -TimeoutSec 15 -SkipHttpErrorCheck
            if ($response.StatusCode -ne 503) { throw "Expected HTTP 503 for missing static data; got $($response.StatusCode)." }
            $payload = $response.Content | ConvertFrom-Json
            if ($payload.state -ne 'Cannot verify') { throw "Expected Cannot verify for missing static data; got '$($payload.state)'." }
            if ($payload.error -match 'profit' -and $payload.error -match '\d') { throw 'Degraded trade-run response appears to invent profitability.' }
          } finally {
            Stop-Process -Id $degraded.Process.Id -Force -ErrorAction SilentlyContinue
            $degraded.Process.WaitForExit(10000) | Out-Null
          }
      - name: Replace stale running NEC instance
        run: node scripts/test-portable-launcher-stale-instance.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-smoke
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.zip
            dist/*.sha256
            static/eve-static.metadata.json
            static/eve-static.db.sha256
