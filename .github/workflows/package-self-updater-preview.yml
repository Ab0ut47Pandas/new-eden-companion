name: package-self-updater-preview

on:
  push:
    branches: ["agent/self-updater"]

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: new-eden-companion-self-updater-preview
          path: |
            dist/*.zip
            dist/*.sha256
