name: static-data

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * *"
  pull_request:
    paths:
      - ".github/workflows/static-data.yml"
      - "scripts/sde/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  build-static-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show CCP current SDE metadata
        run: curl --fail --silent --show-error https://developers.eveonline.com/static-data/tranquility/latest.jsonl
      - name: Build current CCP SDE database
        run: npm run sde:current
      - name: Verify checksum
        working-directory: static
        run: sha256sum --check eve-static.db.sha256
      - name: Show build metadata
        run: cat static/eve-static.metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: eve-static-data
          if-no-files-found: error
          retention-days: 30
          path: |
            static/eve-static.db
            static/eve-static.db.sha256
            static/eve-static.metadata.json
